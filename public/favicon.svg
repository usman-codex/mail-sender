<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mailerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mailerShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="mailerShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer rounded background box -->
  <rect width="64" height="64" rx="16" fill="url(#mailerGrad)"/>
  
  <!-- Inner Subtle Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Mail Base Envelope -->
  <g filter="url(#mailerShadow)">
    <!-- Envelope Body -->
    <rect x="12" y="18" width="40" height="28" rx="5" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.5"/>
    
    <!-- Top Flap Fold -->
    <path d="M13.5 20.5L32 34.5L50.5 20.5" stroke="url(#mailerShine)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed/Paper Plane Accent Dot -->
    <circle cx="48" cy="16" r="3.5" fill="#38BDF8"/>
    <path d="M44 16L39 16" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
